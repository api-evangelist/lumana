aid: lumana
name: Lumana
description: >-
  Lumana is an enterprise AI video security and intelligence platform that turns
  existing camera infrastructure into AI agents for security, safety, and
  operations. Its VIA-1 video intelligence model, Core Series edge AI engine, and
  cloud-based VMS+ management software power Monitor, Response, Investigate, and
  Insight agent capabilities across 50,000+ cameras at customers including Meta,
  Salesforce, and McDonald's. Lumana exposes a developer-friendly Open API,
  outbound webhooks for real-time event triggers, and inbound Event Tags, plus
  pre-built integrations with access control, sensor, communications, monitoring,
  camera, and SSO providers. API access is gated through the partner portal and
  the app.lumana.ai console rather than a public developer portal. Backed by
  Norwest Venture Partners.
